apiVersion: v1
kind: Namespace
metadata:
  name: doks-spot-demo-ops
  labels:
    doks-spot-demo: "true"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-ops-view
  namespace: doks-spot-demo-ops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-ops-view
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "namespaces", "replicationcontrollers", "services", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-ops-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-ops-view
subjects:
  - kind: ServiceAccount
    name: kube-ops-view
    namespace: doks-spot-demo-ops
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-ops-view
  namespace: doks-spot-demo-ops
  labels:
    app: kube-ops-view
    doks-spot-demo: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-ops-view
  template:
    metadata:
      labels:
        app: kube-ops-view
        doks-spot-demo: "true"
    spec:
      serviceAccountName: kube-ops-view
      containers:
        - name: kube-ops-view
          image: hjacobs/kube-ops-view:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 100Mi
            limits:
              cpu: 250m
              memory: 300Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: kube-ops-view
  namespace: doks-spot-demo-ops
  labels:
    doks-spot-demo: "true"
spec:
  type: LoadBalancer
  selector:
    app: kube-ops-view
  ports:
    - port: 80
      targetPort: 8080
